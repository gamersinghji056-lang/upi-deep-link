<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WPAY UPI Link Generator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f6f8fc;font-family:Arial,sans-serif}.wrap{width:min(920px,calc(100% - 24px));margin:0 auto;padding:28px 0 50px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#121a2b;border:1px solid #2a3852;border-radius:18px;padding:18px}h1{margin:0 0 8px}.muted{color:#9aa8be}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;margin:14px 0 6px;font-size:13px;font-weight:700}input,textarea,select{width:100%;background:#0b1220;color:#fff;border:1px solid #30415f;border-radius:12px;padding:12px;font-size:16px}textarea{min-height:96px}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer}.primary{width:100%;margin-top:16px;background:#6977ff;color:#fff}.secondary{background:#1d2941;color:#fff}.msg{margin-top:10px;font-size:13px}.ok{color:#63dea5}.err{color:#ff8290}.result{display:none}.debug{margin-top:12px;background:#0b1220;border:1px solid #263650;border-radius:12px;padding:10px;font:12px monospace;word-break:break-all;color:#bac7dc;white-space:pre-wrap}.short{font-size:18px;font-weight:800}@media(max-width:760px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<h1>WPAY UPI Link Generator</h1>
<p class="muted">Creates clean short checkout links like <strong>pay.wtron.org/pay/WPxxxxxxxx</strong>.</p>
<section class="grid">
<form id="form" class="card">
<label>Upload merchant UPI QR</label>
<input id="qrFile" type="file" accept="image/*">
<div id="qrMsg" class="msg muted">Upload the same QR you want to use for payment.</div>
<label>UPI ID or full upi://pay URI</label>
<textarea id="upiInput" placeholder="merchant@bank or upi://pay?pa=merchant@bank&pn=Merchant"></textarea>
<div class="row">
<div><label>Payee name</label><input id="pn" placeholder="Merchant"></div>
<div><label>Amount INR</label><input id="am" inputmode="decimal" placeholder="10.00"></div>
</div>
<label>Payment profile</label>
<select id="profile">
<option value="scan" selected>Scan-equivalent (recommended)</option>
<option value="exact">Exact QR (no modification)</option>
<option value="standard">Standard UPI intent</option>
</select>
<label>Payment note (manual VPA only)</label>
<input id="tn" maxlength="80" placeholder="Payment">
<button class="btn primary" id="createBtn" type="submit">Create Short Payment Link</button>
<div id="msg" class="msg"></div>
</form>
<section class="card">
<h3>Generated link</h3>
<div id="empty" class="muted">No payment link created yet.</div>
<div id="result" class="result">
<p class="short" id="paymentId"></p>
<input id="checkout" readonly>
<div style="display:flex;gap:8px;margin-top:10px"><button id="copy" type="button" class="btn secondary">Copy</button><button id="open" type="button" class="btn secondary">Open</button></div>
<div class="debug" id="debug"></div>
</div>
</section>
</section>
</main>
<script src="/vendor/html5-qrcode/html5-qrcode.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);const qrFile=$("qrFile"),qrMsg=$("qrMsg"),upiInput=$("upiInput"),pn=$("pn"),am=$("am"),tn=$("tn"),profile=$("profile"),form=$("form"),msg=$("msg"),result=$("result"),empty=$("empty"),checkout=$("checkout"),debug=$("debug"),createBtn=$("createBtn");
function isVpa(v){return /^[^\s@]+@[^\s@]+$/.test((v||"").trim())}
function parseUpi(raw){try{const u=new URL((raw||"").trim());if(u.protocol!=="upi:"||u.hostname!=="pay")return null;return{pa:(u.searchParams.get("pa")||"").trim(),pn:(u.searchParams.get("pn")||"").trim(),am:(u.searchParams.get("am")||"").trim(),tn:(u.searchParams.get("tn")||"").trim()}}catch{return null}}
function buildManual(pa,name,amount,note){const p=new URLSearchParams();p.set("pa",pa);p.set("pn",name||"UPI Payment");p.set("am",Number(amount).toFixed(2));p.set("cu","INR");if(note)p.set("tn",note);return"upi://pay?"+p.toString()}
qrFile.addEventListener("change",async()=>{const file=qrFile.files&&qrFile.files[0];if(!file)return;qrMsg.className="msg muted";qrMsg.textContent="Reading QR...";try{const hidden=document.getElementById("qr-hidden")||document.body.appendChild(Object.assign(document.createElement("div"),{id:"qr-hidden"}));hidden.style.display="none";const scanner=new Html5Qrcode("qr-hidden");const decoded=(await scanner.scanFile(file,true)).trim();const p=parseUpi(decoded);if(!p||!p.pa)throw new Error();upiInput.value=decoded;if(p.pn)pn.value=p.pn;if(p.am)am.value=p.am;if(p.tn)tn.value=p.tn;qrMsg.className="msg ok";qrMsg.textContent="UPI QR loaded."}catch{qrMsg.className="msg err";qrMsg.textContent="Could not read a standard UPI QR."}});
form.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="";createBtn.disabled=true;createBtn.textContent="Creating...";try{let raw=upiInput.value.trim();let source="merchant";let parsed=parseUpi(raw);if(!parsed){if(!isVpa(raw))throw new Error("Enter a valid UPI ID or full UPI URI.");const n=Number(am.value);if(!Number.isFinite(n)||n<=0)throw new Error("Enter a valid amount.");raw=buildManual(raw,pn.value.trim(),n,tn.value.trim());source="manual"}else if(!isVpa(parsed.pa)){throw new Error("QR contains an invalid VPA.")}
const response=await fetch("/api/payments",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({upiUri:raw,amount:am.value.trim(),profile:profile.value,source})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Could not create payment link");checkout.value=data.url;$("paymentId").textContent=data.id;debug.textContent="Short payment ID: "+data.id+"\nProfile: "+profile.value+"\nExpires: "+data.expiresIn+"\n\nThe UPI payload is stored server-side and is no longer exposed in the checkout URL.";empty.style.display="none";result.style.display="block";msg.className="msg ok";msg.textContent="Short payment link created."}catch(err){msg.className="msg err";msg.textContent=err.message||"Could not create payment link"}finally{createBtn.disabled=false;createBtn.textContent="Create Short Payment Link"}});
$("copy").onclick=async()=>navigator.clipboard.writeText(checkout.value);$("open").onclick=()=>{if(checkout.value)window.open(checkout.value,"_blank","noopener")};
})();
</script>
</body>
</html>
