<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>UPI Checkout Link Generator</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f6f8fc;font-family:Arial,sans-serif}
    .wrap{width:min(900px,calc(100% - 24px));margin:0 auto;padding:28px 0 50px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#121a2b;border:1px solid #2a3852;border-radius:18px;padding:18px}
    h1{margin:0 0 8px}.muted{color:#9aa8be}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    label{display:block;margin:14px 0 6px;font-size:13px;font-weight:700}input,textarea{width:100%;background:#0b1220;color:#fff;border:1px solid #30415f;border-radius:12px;padding:12px;font-size:16px}
    textarea{min-height:88px}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer}.primary{width:100%;margin-top:16px;background:#6977ff;color:#fff}
    .secondary{background:#1d2941;color:#fff}.msg{margin-top:10px;font-size:13px}.ok{color:#63dea5}.err{color:#ff8290}.result{display:none}
    .debug{margin-top:12px;background:#0b1220;border:1px solid #263650;border-radius:12px;padding:10px;font:12px monospace;word-break:break-all;color:#bac7dc}
    @media(max-width:760px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="wrap">
  <h1>UPI Checkout Link Generator</h1>
  <p class="muted">Clean test build using standard UPI payment parameters.</p>

  <section class="grid">
    <form id="form" class="card">
      <label>Upload UPI QR</label>
      <input id="qrFile" type="file" accept="image/*">
      <div id="qrMsg" class="msg muted">Optional. Standard UPI QR only.</div>

      <label>UPI ID or full upi://pay URI</label>
      <textarea id="upiInput" placeholder="merchant@bank or upi://pay?pa=merchant@bank&pn=Merchant"></textarea>

      <div class="row">
        <div>
          <label>Payee name</label>
          <input id="pn" placeholder="Merchant">
        </div>
        <div>
          <label>Amount INR</label>
          <input id="am" inputmode="decimal" placeholder="10.00">
        </div>
      </div>

      <label>Payment note (optional)</label>
      <input id="tn" maxlength="80" placeholder="Payment">

      <button class="btn primary" type="submit">Create Checkout Link</button>
      <div id="msg" class="msg"></div>
    </form>

    <section class="card">
      <h3>Generated checkout</h3>
      <div id="empty" class="muted">No checkout created yet.</div>
      <div id="result" class="result">
        <p><strong id="summary"></strong></p>
        <input id="checkout" readonly>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button id="copy" type="button" class="btn secondary">Copy</button>
          <button id="open" type="button" class="btn secondary">Open</button>
        </div>
        <div class="debug" id="debug"></div>
      </div>
    </section>
  </section>
</main>

<script src="/vendor/html5-qrcode/html5-qrcode.min.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const qrFile=$("qrFile"), qrMsg=$("qrMsg"), upiInput=$("upiInput"),
        pn=$("pn"), am=$("am"), tn=$("tn"), form=$("form"), msg=$("msg"),
        result=$("result"), empty=$("empty"), checkout=$("checkout"), debug=$("debug");

  function parseSource(raw){
    raw=(raw||"").trim();
    if(!raw) return null;

    if(/^upi:\/\/pay\?/i.test(raw)){
      try{
        const u=new URL(raw);
        return {
          pa:(u.searchParams.get("pa")||"").trim(),
          pn:(u.searchParams.get("pn")||"").trim(),
          am:(u.searchParams.get("am")||"").trim(),
          tn:(u.searchParams.get("tn")||"").trim()
        };
      }catch(e){ return null; }
    }

    if(/^[^\s@]+@[^\s@]+$/.test(raw)){
      return {pa:raw,pn:"",am:"",tn:""};
    }
    return null;
  }

  function buildStandardUpi(pa,pn,am,tn){
    const p=new URLSearchParams();
    p.set("pa",pa);
    p.set("pn",pn || "UPI Payment");
    p.set("am",Number(am).toFixed(2));
    p.set("cu","INR");
    if(tn) p.set("tn",tn);
    return "upi://pay?" + p.toString();
  }

  qrFile.addEventListener("change", async function(){
    const file=qrFile.files && qrFile.files[0];
    if(!file) return;
    qrMsg.className="msg muted"; qrMsg.textContent="Reading QR...";
    try{
      if(!window.Html5Qrcode) throw new Error("decoder missing");
      const hidden=document.getElementById("qr-hidden") || document.body.appendChild(Object.assign(document.createElement("div"),{id:"qr-hidden"}));
      hidden.style.display="none";
      const scanner=new Html5Qrcode("qr-hidden");
      const decoded=await scanner.scanFile(file,true);
      const parsed=parseSource(decoded);
      if(!parsed || !parsed.pa) throw new Error("not standard upi");
      upiInput.value=decoded;
      if(parsed.pn) pn.value=parsed.pn;
      if(parsed.am) am.value=parsed.am;
      if(parsed.tn) tn.value=parsed.tn;
      qrMsg.className="msg ok"; qrMsg.textContent="Detected: "+parsed.pa;
    }catch(e){
      qrMsg.className="msg err"; qrMsg.textContent="Could not read a standard UPI QR.";
    }
  });

  form.addEventListener("submit", function(e){
    e.preventDefault();
    const parsed=parseSource(upiInput.value);
    if(!parsed || !parsed.pa){
      msg.className="msg err"; msg.textContent="Invalid UPI ID / QR URI."; return;
    }

    const amount=Number(am.value.trim() || parsed.am);
    if(!Number.isFinite(amount) || amount<=0){
      msg.className="msg err"; msg.textContent="Enter a valid amount."; return;
    }

    const name=(pn.value.trim() || parsed.pn || "UPI Payment").slice(0,60);
    const note=(tn.value.trim() || parsed.tn || "").slice(0,80);
    const upiUri=buildStandardUpi(parsed.pa,name,amount,note);

    const q=new URLSearchParams();
    q.set("upi",upiUri);
    const link=location.origin+"/pay?"+q.toString();

    checkout.value=link;
    $("summary").textContent="INR "+amount.toFixed(2)+" -> "+parsed.pa;
    debug.textContent="Generated UPI URI: "+upiUri;
    empty.style.display="none"; result.style.display="block";
    msg.className="msg ok"; msg.textContent="Checkout created.";
  });

  $("copy").onclick=async()=>{await navigator.clipboard.writeText(checkout.value)};
  $("open").onclick=()=>{if(checkout.value) window.open(checkout.value,"_blank","noopener")};
})();
</script>
</body>
</html>
