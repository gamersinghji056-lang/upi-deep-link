<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090617">
<title>WPAY Login</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 600px at 20% 0,#311c7d 0,transparent 60%),linear-gradient(135deg,#090617,#0e0a22 55%,#15102f);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;padding:24px}.card{width:min(430px,100%);background:linear-gradient(180deg,#17102f,#100b24);border:1px solid #3b2e68;border-radius:24px;padding:28px;box-shadow:0 28px 80px #0009,inset 0 1px #ffffff12}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.logo{width:52px;height:44px;position:relative}.logo i{position:absolute;top:8px;height:26px;width:25px;border-radius:9px;transform:skewX(-24deg);box-shadow:inset 0 1px #ffffff55}.logo i:nth-child(1){left:0;background:linear-gradient(145deg,#fff,#cfd3ff)}.logo i:nth-child(2){left:15px;background:linear-gradient(145deg,#a27aff,#673be8)}.logo i:nth-child(3){left:30px;background:linear-gradient(145deg,#f7f5ff,#c5caff)}.brand strong{font-size:28px;letter-spacing:-.04em}.brand small{display:block;color:#aaa4c6;margin-top:3px}.eyebrow{font-size:11px;letter-spacing:.2em;font-weight:900;color:#9d7cff}.card h1{font-size:28px;margin:8px 0 8px}.sub{color:#b7b1ca;line-height:1.6;margin:0 0 22px}.field{margin-top:14px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px;color:#d4d0e0}.field input{width:100%;height:52px;border-radius:14px;border:1px solid #3a3061;background:#0b071b;color:#fff;padding:0 14px;font-size:16px;outline:none}.field input:focus{border-color:#7d59ff;box-shadow:0 0 0 3px #7d59ff22}.btn{width:100%;height:52px;margin-top:20px;border:0;border-radius:14px;background:linear-gradient(90deg,#7b55ff,#5a36e7);color:#fff;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 14px 30px #5034dc55}.btn:disabled{opacity:.6;cursor:not-allowed}.msg{min-height:20px;margin-top:12px;font-size:13px;color:#ff9bab}.foot{margin-top:18px;padding-top:16px;border-top:1px solid #2d244c;color:#8882a0;font-size:12px;text-align:center}
</style>
</head>
<body>
<form class="card" id="loginForm" autocomplete="on">
  <div class="brand"><div class="logo"><i></i><i></i><i></i></div><div><strong>WPAY</strong><small>Secure merchant dashboard</small></div></div>
  <div class="eyebrow">AUTHORIZED ACCESS</div>
  <h1>Sign in</h1>
  <p class="sub">Login is required to create payment links, pair devices and view UTR/OTP monitoring data.</p>
  <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" value="admin" required></div>
  <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus></div>
  <button class="btn" id="submitBtn" type="submit">Login to WPAY</button>
  <div class="msg" id="msg"></div>
  <div class="foot">Session automatically expires after 12 hours.</div>
</form>
<script>
const form=document.getElementById('loginForm'),btn=document.getElementById('submitBtn'),msg=document.getElementById('msg');
form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;msg.textContent='';try{const r=await fetch('/api/dashboard/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.username.value,password:form.password.value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Login failed');location.replace('/');}catch(err){msg.textContent=err.message||'Login failed';}finally{btn.disabled=false;}});
</script>
</body>
</html>
