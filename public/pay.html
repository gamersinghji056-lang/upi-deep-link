<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f1c" />
  <title>Pay via UPI</title>
  <style>
    :root { color-scheme:dark; --bg:#070b14; --card:#111827; --line:#27344d; --text:#f8fafc; --muted:#96a3b7; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:linear-gradient(180deg,#070b14,#0e1626); color:var(--text);
    }
    .wrap { width:min(460px,calc(100% - 24px)); margin:0 auto; padding:32px 0 60px; }
    .top { text-align:center; margin-bottom:18px; }
    .brand { font-size:13px; color:#a9b5c7; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    .card { background:#111827; border:1px solid var(--line); border-radius:24px; padding:22px; }
    .label { color:var(--muted); font-size:13px; }
    .amount { font-size:44px; font-weight:900; letter-spacing:-.05em; margin:4px 0 8px; }
    .payee { font-size:18px; font-weight:800; margin-top:6px; word-break:break-word; }
    .upi { color:var(--muted); margin-top:4px; font-size:14px; word-break:break-all; }
    .divider { height:1px; background:var(--line); margin:20px 0; }
    .apps { display:grid; gap:11px; }
    button {
      width:100%; min-height:56px; border-radius:16px; border:1px solid #2c3a55; color:white;
      background:#182238; padding:0 16px; font-size:16px; font-weight:850; cursor:pointer;
      display:flex; align-items:center; justify-content:space-between;
    }
    button:active { transform:translateY(1px); }
    .app-left { display:flex; align-items:center; gap:12px; }
    .logo {
      width:34px; height:34px; border-radius:10px; display:grid; place-items:center;
      background:#f8fafc; color:#111827; font-weight:950; font-size:13px;
    }
    .generic { background:linear-gradient(135deg,#5c6cff,#7257ef); border-color:transparent; }
    .note { margin-top:16px; color:var(--muted); font-size:12px; line-height:1.55; text-align:center; }
    .err { display:none; color:#ff96a2; font-size:13px; margin-top:12px; text-align:center; }
    @media (max-width:380px) { .card { padding:17px; } .amount { font-size:38px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><div class="brand">Secure UPI Test Checkout</div></div>
    <section class="card">
      <div class="label">Amount to pay</div>
      <div id="amount" class="amount">â‚¹0.00</div>
      <div id="name" class="payee">UPI Payment</div>
      <div id="upi" class="upi"></div>
      <div class="divider"></div>

      <div class="label" style="margin-bottom:10px">Choose UPI app</div>
      <div class="apps">
        <button type="button" data-app="phonepe">
          <span class="app-left"><span class="logo">Pe</span>PhonePe</span><span>â€º</span>
        </button>
        <button type="button" data-app="paytm">
          <span class="app-left"><span class="logo">P</span>Paytm</span><span>â€º</span>
        </button>
        <button type="button" data-app="gpay">
          <span class="app-left"><span class="logo">G</span>Google Pay</span><span>â€º</span>
        </button>
        <button type="button" class="generic" data-app="upi">
          <span class="app-left"><span class="logo">UPI</span>Other UPI Apps</span><span>â€º</span>
        </button>
      </div>
      <div id="error" class="err"></div>
      <div class="note">
        Testing build only. This page starts a UPI intent/deep link; it does not confirm whether payment succeeded.
      </div>
    </section>
  </main>

  <script>
    (() => {
      const q = new URLSearchParams(location.search);
      const data = {};
      q.forEach((value, key) => {
        data[key] = value;
      });

      data.pa = (data.pa || "").trim();
      data.pn = (data.pn || "UPI Payment").trim();
      data.am = (data.am || "").trim();
      data.tn = (data.tn || "Payment").trim();
      data.tr = (data.tr || "").trim();
      data.cu = (data.cu || "INR").trim() || "INR";

      const amount = Number(data.am);
      const validVpa = /^[^\s@]+@[^\s@]+$/.test(data.pa);
      const validAmount = Number.isFinite(amount) && amount > 0;

      document.getElementById("amount").textContent = validAmount ? "â‚¹" + amount.toFixed(2) : "Invalid amount";
      document.getElementById("name").textContent = data.pn || "UPI Payment";
      document.getElementById("upi").textContent = data.pa || "Missing UPI ID";

      const error = document.getElementById("error");
      if (!validVpa || !validAmount) {
        error.style.display = "block";
        error.textContent = "This checkout link is missing valid UPI payment details.";
        document.querySelectorAll("button[data-app]").forEach(b => b.disabled = true);
        return;
      }

      function queryString() {
        const p = new URLSearchParams();

        Object.entries(data).forEach(([key, value]) => {
          if (value !== null && value !== undefined && String(value) !== "") {
            p.set(key, String(value));
          }
        });

        p.set("pa", data.pa);
        p.set("pn", data.pn);
        p.set("tn", data.tn);
        p.set("am", amount.toFixed(2));
        p.set("cu", data.cu || "INR");

        if (!p.get("tr")) {
          p.set("tr", ("WEB" + Date.now().toString(36).toUpperCase()).slice(0, 35));
        }

        if (!p.get("url")) {
          p.set("url", location.origin + "/pay");
        }

        return p.toString();
      }

      function isAndroid() {
        return /Android/i.test(navigator.userAgent || "");
      }

      function androidIntent(packageName) {
        const qs = queryString();
        return "intent://pay?" + qs +
          "#Intent;scheme=upi;package=" + packageName + ";end";
      }

      function targetFor(app) {
        const qs = queryString();

        if (isAndroid()) {
          if (app === "phonepe") return androidIntent("com.phonepe.app");
          if (app === "paytm") return androidIntent("net.one97.paytm");
          if (app === "gpay") return androidIntent("com.google.android.apps.nbu.paisa.user");
        }

        if (app === "gpay") return "gpay://upi/pay?" + qs;

        // Generic standard UPI URI is the safest cross-app fallback.
        return "upi://pay?" + qs;
      }

      document.querySelectorAll("button[data-app]").forEach(button => {
        button.addEventListener("click", () => {
          const app = button.dataset.app;
          const target = targetFor(app);
          error.style.display = "none";
          window.location.href = target;

          if (app !== "upi") {
            setTimeout(() => {
              if (!document.hidden) {
                error.style.display = "block";
                error.textContent = "If the selected app did not open, try â€œOther UPI Appsâ€.";
              }
            }, 1800);
          }
        });
      });
    })();
  </script>
</body>
</html>
